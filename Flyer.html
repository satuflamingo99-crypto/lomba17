<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flyer GMDP Cup 🎈 — 17 Agustus</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6e3e3;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 12px}
.bar{margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button.btn{border:none;border-radius:10px;padding:9px 16px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
button.png{background:#16a34a;color:#fff}
button.pdf{background:#1095db;color:#fff}
button.btn:active{transform:translateY(2px);box-shadow:none}
.flyer{position:relative;width:min(560px,96%);border-radius:18px;overflow:hidden;box-shadow:0 16px 40px rgba(127,29,29,.45)}
.bg{width:100%;display:block}
.logo{position:absolute;right:14px;bottom:56px;width:140px;transform:rotate(-5deg);filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.logo img{width:100%;display:block}
.soc{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;background:#7f1d1d;color:#fff;font-weight:800;font-size:.82rem;padding:8px 6px}
.soc svg{vertical-align:-3px;margin-right:5px}
@media print{body{background:#fff;padding:0}.bar{display:none}.flyer{box-shadow:none;width:100%}}
</style>
</head>
<body>
<div class="bar">
 <button class="btn png" onclick="simpanPNG()">📲 Simpan PNG (untuk WA)</button>
 <button class="btn pdf" onclick="window.print()">🖨 Cetak / PDF</button>
</div>
<div class="flyer" id="flyer">
 <img class="bg" src="ilustrasi.png" alt="Flyer GMDP Cup 17 Agustus" onerror="this.style.display='none'">
 <div class="logo"><img src="logo.png" alt="GMDP Internet & Data Service" onerror="this.parentElement.style.display='none'"></div>
 <div class="soc">
  <span><svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="2"/><circle cx="17.2" cy="6.8" r="1.3" fill="#fff"/></svg>@gmdp.net.id</span>
  <span>•</span>
  <span><svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="#fff" stroke-width="2"/></svg>gmdp.net.id</span>
 </div>
</div>
<script>
function simpanPNG(){
 if(!window.html2canvas){alert('Butuh internet untuk membuat PNG. Coba tombol 🖨 Cetak/PDF.');return}
 html2canvas(document.getElementById('flyer'),{scale:2,useCORS:true}).then(function(c){
  var a=document.createElement('a');a.download='flyer-gmdp-17-agustus.png';a.href=c.toDataURL('image/png');a.click();
 }).catch(function(){
  alert('Browser memblokir gambar (file://). Solusi: pakai 🖨 Cetak → Save as PDF, atau screenshot halaman ini.');
 });
}
</script>
</body>
</html>
