<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMDP Cup ✏️ — Memasukkan Pensil ke Botol</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:linear-gradient(180deg,#7dd3fc,#e0f2fe 60%,#fef9c3);min-height:100vh;padding:16px;color:#0f172a}
.wrap{max-width:1150px;margin:0 auto}
header{padding:8px 0 4px;text-align:center}
h1{font-size:1.3rem;letter-spacing:.5px;color:#0c4a6e}
h1 .balon{font-size:1.4rem;animation:fl 2.6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bar{display:flex;gap:10px;justify-content:center;margin:6px 0 12px;flex-wrap:wrap}
a.btn,button.btn{display:inline-block;background:#0ea5e9;color:#fff;padding:8px 14px;font-weight:700;border-radius:10px;box-shadow:0 3px 0 #0369a1;text-decoration:none;border:none;cursor:pointer}
button.btn.red{background:#ef4444;box-shadow:0 3px 0 #b91c1c}
button.btn.yellow{background:#ffe600;color:#111;box-shadow:0 3px 0 #ca8a04}
.btn:active{transform:translateY(2px);box-shadow:none}
.judul{background:#ffe600;border:2px solid #111;border-radius:12px;padding:10px;text-align:center;font-size:1.1rem;margin:10px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.grid.one{justify-items:center}
.grid.one .heat{width:min(460px,100%)}
.heat{background:#fff;border:2px solid #111;border-radius:14px;overflow:hidden}
.heat h3{background:#ffe600;border-bottom:2px solid #111;padding:7px;text-align:center}
.p{padding:9px 10px;border-bottom:1px solid #e2e8f0;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.p:last-child{border:none}
.p:hover{background:#e0f2fe}
.p.sel{background:#bbf7d0;font-weight:800}
.p.sel::after{content:"✔ LOLOS";font-size:.66rem;background:#16a34a;color:#fff;border-radius:6px;padding:2px 6px}
.p.pick{outline:3px solid #f97316;background:#ffedd5}
.p.empty{color:#94a3b8;font-style:italic;cursor:default}
.p.empty:hover{background:transparent}
.p.r1{background:#fde047;font-weight:900}
.p.r1::after{content:"🥇 JUARA 1";font-size:.66rem;background:#ca8a04;color:#fff;border-radius:6px;padding:2px 6px}
.p.r2{background:#e2e8f0;font-weight:800}
.p.r2::after{content:"🥈 JUARA 2";font-size:.66rem;background:#64748b;color:#fff;border-radius:6px;padding:2px 6px}
.p.r3{background:#fed7aa;font-weight:800}
.p.r3::after{content:"🥉 JUARA 3";font-size:.66rem;background:#c2410c;color:#fff;border-radius:6px;padding:2px 6px}
.tag{font-size:.66rem;background:#ffe600;border:1px solid #111;border-radius:6px;padding:1px 5px;font-weight:800}
.podium{margin:16px auto 0;background:#fff;border:3px solid #ca8a04;border-radius:18px;padding:14px;max-width:560px;text-align:center}
.prow{display:flex;justify-content:center;gap:8px;font-weight:800;font-size:1rem;padding:4px;flex-wrap:wrap}
.prow .nama{min-width:180px;text-align:left}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#ffe600;padding:10px 18px;border-radius:12px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:99}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
 <header><h1><span class="balon">✏️</span> GMDP CUP — LOMBA MEMASUKKAN PENSIL KE BOTOL <span class="balon">🍾</span></h1></header>
 <div class="bar">
  <a class="btn" href="index.html">⬅ Menu Utama</a>
  <button class="btn yellow" id="btnMove" onclick="toggleMove()">⚙ Mode Pindah: OFF</button>
  <button class="btn red" onclick="resetI()">🔄 Reset Bagan</button>
 </div>
 <h2 class="judul">🏃 HEAT 1–6</h2>
 <div class="grid" id="heats"></div>
 <h2 class="judul" style="margin-top:16px">FINAL A (HEAT 1–3) — PEREBUTAN JUARA 1‑2‑3</h2>
 <div class="grid one" id="finalA"></div>
 <h2 class="judul" style="margin-top:16px">FINAL B (HEAT 4–6) — PEREBUTAN JUARA 1‑2‑3</h2>
 <div class="grid one" id="finalB"></div>
 <div class="podium">
  <h3>🏆 PODIUM JUARA</h3>
  <div class="prow">🥇 <span class="nama" id="j1a">—</span><span class="nama" id="j1b">—</span></div>
  <div class="prow">🥈 <span class="nama" id="j2a">—</span><span class="nama" id="j2b">—</span></div>
  <div class="prow">🥉 <span class="nama" id="j3a">—</span><span class="nama" id="j3b">—</span></div>
 </div>
</div>
<div id="toast"></div>
<script>
const ORIG=[
 ["Lia","Dimas","Rara","Krisna","Cile"],
 ["Firda","Bayu","Mamake","Rio","Mas Palung"],
 ["Oho","Anak PKL","Pendi","Pak Kunto","Yosep"],
 ["Mas Tri","Adit","Anak PKL","Teguh","Triju"],
 ["Om Nano","Reza","Anak PKL","Yayah","Mas Kukuh"],
 ["Demong","Anak PKL","Yohan","Maul","Rahmat"]
];
let N=ORIG.map(h=>[...h]);
let I={heat:[[],[],[],[],[],[]],podA:[],podB:[]};
let moveMode=false,picked=null;
const el=id=>document.getElementById(id);
let tT;function flash(m){const t=el("toast");t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),1800);}
const nm=id=>N[+id.charAt(1)][+id.charAt(3)];
const finA=()=>[...I.heat[0],...I.heat[1],...I.heat[2]];
const finB=()=>[...I.heat[3],...I.heat[4],...I.heat[5]];

/* ===== SIMPAN OTOMATIS (localStorage) ===== */
const KEY='gmdp_individu_v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({N,I}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');
 if(d){
  if(Array.isArray(d.N)&&d.N.length===6&&d.N.every(r=>Array.isArray(r)&&r.length===5))N=d.N;
  if(d.I&&Array.isArray(d.I.heat)&&d.I.heat.length===6){
   I.heat=d.I.heat;
   I.podA=Array.isArray(d.I.podA)?d.I.podA:[];
   I.podB=Array.isArray(d.I.podB)?d.I.podB:[];
  }
 }
}catch(e){}}

function toggleMove(){moveMode=!moveMode;picked=null;
 el("btnMove").textContent="⚙ Mode Pindah: "+(moveMode?"ON":"OFF");
 renderI();flash(moveMode?"Mode pindah AKTIF.":"Mode pindah nonaktif.");}
function clickName(i,j){
 const id="H"+i+"-"+j;
 if(moveMode){
  if(!picked){picked=[i,j];renderI();return;}
  if(picked[0]===i&&picked[1]===j){picked=null;renderI();return;}
  const t=N[picked[0]][picked[1]];N[picked[0]][picked[1]]=N[i][j];N[i][j]=t;
  picked=null;I.heat=[[],[],[],[],[],[]];I.podA=[];I.podB=[];
  renderI();flash("Posisi nama ditukar. Pilihan lolos & podium direset.");return;
 }
 const arr=I.heat[i],ix=arr.indexOf(id);
 if(ix>=0)arr.splice(ix,1);
 else if(arr.length<1)arr.push(id);
 else return flash("Maksimal 1 lolos per heat!");
 const fa=finA(),fb=finB();
 I.podA=I.podA.filter(x=>fa.includes(x));I.podB=I.podB.filter(x=>fb.includes(x));
 renderI();
}
function pickFin(br,id){
 if(moveMode)return flash("Matikan Mode Pindah untuk memilih juara.");
 const arr=br==="A"?I.podA:I.podB,ix=arr.indexOf(id);
 if(ix>=0)arr.splice(ix,1);
 else if(arr.length<3)arr.push(id);
 else return flash("Podium "+br+" penuh (3). Klik nama berpodium untuk membatalkan.");
 renderI();
}
function resetI(){I={heat:[[],[],[],[],[],[]],podA:[],podB:[]};picked=null;renderI();flash("Bagan individu direset.");}
function finHTML(br,parts){
 const arr=br==="A"?I.podA:I.podB;let fb="";
 for(let x=0;x<3;x++){const id=parts[x];
  if(id){const px=arr.indexOf(id),r=px>=0?px+1:0;
   fb+='<div class="p'+(r?" r"+r:"")+'" onclick="pickFin(\''+br+'\',\''+id+'\')">'+nm(id)+' <span class="tag">H'+(+id.charAt(1)+1)+'</span></div>';
  }else fb+='<div class="p empty">menunggu heat…</div>';}
 return '<div class="heat"><h3>FINAL '+br+' — 3 PESERTA</h3>'+fb+"</div>";
}
function renderI(){
 el("heats").innerHTML=ORIG.map((h,i)=>'<div class="heat"><h3>HEAT '+(i+1)+'</h3>'+N[i].map((n,j)=>{
  const id="H"+i+"-"+j;
  const isPick=moveMode&&picked&&picked[0]===i&&picked[1]===j;
  const cls="p"+(I.heat[i].includes(id)?" sel":"")+(isPick?" pick":"");
  return '<div class="'+cls+'" onclick="clickName('+i+','+j+')">'+n+'</div>';
 }).join("")+"</div>").join("");
 el("finalA").innerHTML=finHTML("A",finA());
 el("finalB").innerHTML=finHTML("B",finB());
 el("j1a").textContent=I.podA[0]?nm(I.podA[0]):"—";
 el("j2a").textContent=I.podA[1]?nm(I.podA[1]):"—";
 el("j3a").textContent=I.podA[2]?nm(I.podA[2]):"—";
 el("j1b").textContent=I.podB[0]?nm(I.podB[0]):"—";
 el("j2b").textContent=I.podB[1]?nm(I.podB[1]):"—";
 el("j3b").textContent=I.podB[2]?nm(I.podB[2]):"—";
 save();
}
load();
renderI();
</script>
</body>
</html>
